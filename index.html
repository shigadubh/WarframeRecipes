<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Craft Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg-primary:#0a0e14;--bg-secondary:#111820;--bg-tertiary:#1a2230;--bg-card:#151d28;--bg-card-hover:#1c2737;--bg-input:#0d1117;--border-color:#1e2d3d;--border-accent:#00e8fc33;--text-primary:#e0e6ed;--text-secondary:#8899aa;--text-muted:#556677;--accent-primary:#00e8fc;--accent-secondary:#00bcd4;--accent-glow:#00e8fc33;--success:#4caf50;--success-bg:#4caf5022;--warning:#ff9800;--warning-bg:#ff980022;--danger:#f44336;--danger-bg:#f4433622;--gold:#ffd700;--gold-bg:#ffd70015;--prime-gold:#c4a24e;--prime-gold-light:#e8d48b;--shadow-md:0 4px 12px rgba(0,0,0,0.4);--shadow-lg:0 8px 24px rgba(0,0,0,0.5);--shadow-glow:0 0 20px rgba(0,232,252,0.15);--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--transition:0.2s ease;--crafted-red:#e53935;--crafted-red-bg:#e5393522;--crafted-red-glow:0 0 12px rgba(229,57,53,0.3);}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:'Rajdhani',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;font-size:16px;line-height:1.5;}
        body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,232,252,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,rgba(0,188,212,0.03) 0%,transparent 50%);pointer-events:none;z-index:0;}
        #app{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:8px;}
        ::-webkit-scrollbar-track{background:var(--bg-primary);}
        ::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px;}
        ::-webkit-scrollbar-thumb:hover{background:var(--accent-secondary);}

        .loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease;}
        .loading-screen.hidden{opacity:0;pointer-events:none;}
        .loading-logo{width:80px;height:80px;margin-bottom:24px;animation:loadPulse 1.5s ease-in-out infinite;}
        @keyframes loadPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(0,232,252,0.4));}50%{transform:scale(1.1);filter:drop-shadow(0 0 20px rgba(0,232,252,0.7));}}
        .loading-text{font-family:'Orbitron',sans-serif;color:var(--accent-primary);font-size:14px;letter-spacing:3px;margin-bottom:20px;}
        .loading-bar-container{width:300px;height:4px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden;margin-bottom:12px;}
        .loading-bar{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--accent-primary),var(--accent-secondary));transition:width 0.3s ease;}
        .loading-status{font-size:13px;color:var(--text-muted);min-height:20px;}
        .loading-error{color:var(--warning);font-size:13px;margin-top:12px;max-width:400px;text-align:center;}
        .loading-error button{margin-top:10px;padding:8px 20px;background:var(--accent-primary);color:var(--bg-primary);border:none;border-radius:var(--radius-md);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}

        .header{position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);box-shadow:var(--shadow-md);}
        .header-content{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1400px;margin:0 auto;}
        .logo{display:flex;align-items:center;gap:12px;}
        .logo-icon{filter:drop-shadow(0 0 8px rgba(0,232,252,0.4));animation:logoPulse 3s ease-in-out infinite;}
        @keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(0,232,252,0.4));}50%{filter:drop-shadow(0 0 16px rgba(0,232,252,0.6));}}
        .logo h1{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:var(--accent-primary);letter-spacing:3px;text-shadow:0 0 20px rgba(0,232,252,0.3);}
        .user-section{display:flex;align-items:center;gap:10px;}
        .user-name{font-size:14px;color:var(--text-secondary);font-weight:500;letter-spacing:1px;text-transform:uppercase;}
        .btn-small{background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);display:flex;align-items:center;}
        .btn-small:hover{background:var(--bg-card-hover);color:var(--accent-primary);border-color:var(--accent-primary);}
        .api-status{font-size:11px;padding:3px 8px;border-radius:3px;letter-spacing:1px;font-weight:600;}
        .api-status.online{background:var(--success-bg);color:var(--success);border:1px solid rgba(76,175,80,0.27);}
        .api-status.offline{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(255,152,0,0.27);}
        .backup-indicator{font-size:10px;padding:2px 6px;border-radius:3px;letter-spacing:0.5px;font-weight:600;cursor:help;}
        .backup-indicator.ok{background:var(--success-bg);color:var(--success);}

        .nav-tabs{display:flex;max-width:1400px;margin:0 auto;padding:0 24px;}
        .nav-tab{display:flex;align-items:center;gap:8px;padding:12px 24px;background:none;border:none;color:var(--text-muted);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:var(--transition);position:relative;text-transform:uppercase;}
        .nav-tab::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:transparent;transition:var(--transition);}
        .nav-tab:hover{color:var(--text-secondary);}
        .nav-tab.active{color:var(--accent-primary);}
        .nav-tab.active::after{background:var(--accent-primary);box-shadow:0 0 10px rgba(0,232,252,0.5);}
        .nav-tab svg{opacity:0.7;}
        .nav-tab.active svg{opacity:1;stroke:var(--accent-primary);}

        .tab-content{display:none;max-width:1400px;margin:0 auto;padding:20px 24px;animation:fadeIn 0.3s ease;}
        .tab-content.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

        .controls-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
        .search-box{display:flex;align-items:center;gap:10px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px 16px;flex:1;min-width:200px;transition:var(--transition);}
        .search-box:focus-within{border-color:var(--accent-primary);box-shadow:0 0 0 2px var(--accent-glow);}
        .search-box svg{stroke:var(--text-muted);flex-shrink:0;}
        .search-box input{background:none;border:none;color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:15px;width:100%;outline:none;}
        .search-box input::placeholder{color:var(--text-muted);}
        .filter-group{display:flex;gap:8px;flex-wrap:wrap;}
        .filter-select{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:14px;padding:10px 14px;border-radius:var(--radius-md);cursor:pointer;transition:var(--transition);outline:none;}
        .filter-select:hover,.filter-select:focus{border-color:var(--accent-primary);}
        .filter-select option{background:var(--bg-secondary);color:var(--text-primary);}

        .btn-primary{display:flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:var(--bg-primary);border:none;border-radius:var(--radius-md);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:var(--transition);text-transform:uppercase;white-space:nowrap;}
        .btn-primary:hover{box-shadow:var(--shadow-glow);transform:translateY(-1px);}
        .btn-primary:active{transform:translateY(0);}
        .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
        .btn-secondary{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg-tertiary);color:var(--text-secondary);border:1px solid var(--border-color);border-radius:var(--radius-md);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);}
        .btn-secondary:hover{background:var(--bg-card-hover);color:var(--accent-primary);border-color:var(--accent-primary);}
        .btn-warning{background:linear-gradient(135deg,var(--warning),#e68900);}
        .btn-danger{background:linear-gradient(135deg,var(--crafted-red),#c62828);}
        .btn-danger-outline{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:6px 12px;border-radius:var(--radius-sm);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);}
        .btn-danger-outline:hover{background:var(--danger-bg);}

        .recipes-stats,.inventory-stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
        .stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px 20px;display:flex;align-items:center;gap:12px;flex:1;min-width:140px;}
        .stat-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;}
        .stat-icon.blue{background:var(--accent-glow);}
        .stat-icon.green{background:var(--success-bg);}
        .stat-icon.orange{background:var(--warning-bg);}
        .stat-icon.gold{background:var(--gold-bg);}
        .stat-icon.red{background:var(--crafted-red-bg);}
        .stat-info{display:flex;flex-direction:column;}
        .stat-value{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;color:var(--text-primary);line-height:1;}
        .stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}

        /* ===== RECIPE CARDS ===== */
        .recipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .recipe-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;transition:var(--transition);cursor:pointer;position:relative;}
        .recipe-card:hover{border-color:var(--accent-primary);box-shadow:var(--shadow-glow);transform:translateY(-2px);}
        .recipe-card.prime{border-color:rgba(196,162,78,0.2);}
        .recipe-card.prime:hover{border-color:var(--prime-gold);box-shadow:0 0 20px rgba(196,162,78,0.15);}

        /* CRAFTED CARD STYLES */
        .recipe-card.crafted{border-color:var(--crafted-red)44;opacity:0.75;}
        .recipe-card.crafted:hover{border-color:var(--crafted-red);box-shadow:var(--crafted-red-glow);opacity:1;}

        .recipe-card-header{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .recipe-name{font-size:18px;font-weight:700;color:var(--text-primary);letter-spacing:0.5px;}
        .recipe-card.prime .recipe-name{color:var(--prime-gold-light);}
        .recipe-card.crafted .recipe-name{text-decoration:line-through;text-decoration-color:var(--crafted-red);text-decoration-thickness:2px;}
        .recipe-category{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;}

        .recipe-header-badges{display:flex;gap:6px;align-items:center;flex-shrink:0;}

        .recipe-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
        .recipe-badge.complete{background:var(--success-bg);color:var(--success);border:1px solid rgba(76,175,80,0.27);}
        .recipe-badge.partial{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(255,152,0,0.27);}
        .recipe-badge.none{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(244,67,54,0.27);}

        /* CRAFTED SWITCH ON CARD */
        .crafted-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:var(--transition);user-select:none;border:1px solid transparent;}
        .crafted-badge.not-crafted{background:var(--bg-tertiary);color:var(--text-muted);border-color:var(--border-color);}
        .crafted-badge.not-crafted:hover{border-color:var(--crafted-red);color:var(--crafted-red);}
        .crafted-badge.is-crafted{background:var(--crafted-red);color:white;border-color:var(--crafted-red);animation:craftedPulse 0.3s ease;}
        .crafted-badge.is-crafted:hover{background:var(--crafted-red)cc;}
        @keyframes craftedPulse{0%{transform:scale(0.9);}50%{transform:scale(1.1);}100%{transform:scale(1);}}

        .recipe-card-body{padding:6px 18px 14px;}
        .recipe-progress-bar{width:100%;height:6px;background:var(--bg-primary);border-radius:3px;overflow:hidden;margin-bottom:10px;}
        .recipe-progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
        .recipe-progress-fill.green{background:linear-gradient(90deg,var(--success),#66bb6a);}
        .recipe-progress-fill.orange{background:linear-gradient(90deg,var(--warning),#ffb74d);}
        .recipe-progress-fill.red{background:linear-gradient(90deg,var(--danger),#e57373);}
        .recipe-progress-fill.gold{background:linear-gradient(90deg,var(--prime-gold),var(--prime-gold-light));}
        .recipe-items-preview{display:flex;flex-wrap:wrap;gap:6px;}
        .recipe-item-tag{font-size:12px;padding:3px 8px;border-radius:3px;background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-muted);display:flex;align-items:center;gap:4px;}
        .recipe-item-tag.owned{border-color:rgba(76,175,80,0.27);color:var(--success);background:var(--success-bg);}
        .recipe-item-tag .check{font-size:10px;}
        .recipe-counter{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--text-secondary);text-align:right;margin-top:6px;}
        .recipe-card-footer{padding:4px 18px 12px;display:flex;justify-content:space-between;align-items:center;}
        .craft-count-badge{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.5px;}
        .craft-count-badge strong{color:var(--accent-primary);font-family:'Orbitron',sans-serif;font-size:13px;}

        /* INVENTORY */
        .inventory-list{display:flex;flex-direction:column;gap:8px;}
        .inventory-item{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;transition:var(--transition);}
        .inventory-item:hover{border-color:var(--border-accent);background:var(--bg-card-hover);}
        .inventory-item-info{display:flex;flex-direction:column;flex:1;min-width:0;}
        .inventory-item-name{font-size:16px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .inventory-item-parent{font-size:11px;color:var(--accent-secondary);margin-top:1px;}
        .inventory-item-recipes{font-size:12px;color:var(--text-muted);margin-top:2px;}
        .inventory-item-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
        .quantity-control{display:flex;align-items:center;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);overflow:hidden;}
        .quantity-btn{width:32px;height:32px;background:var(--bg-tertiary);border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;}
        .quantity-btn:hover{background:var(--accent-primary);color:var(--bg-primary);}
        .quantity-value{width:40px;text-align:center;font-family:'Orbitron',sans-serif;font-size:14px;color:var(--accent-primary);font-weight:600;}

        /* MODALS */
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:modalFade 0.2s ease;padding:20px;}
        .modal.hidden{display:none;}
        @keyframes modalFade{from{opacity:0;}to{opacity:1;}}
        .modal-content{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalSlide 0.3s ease;}
        @keyframes modalSlide{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border-color);}
        .modal-header h2{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--accent-primary);letter-spacing:2px;}
        .modal-close{background:none;border:none;color:var(--text-muted);font-size:28px;cursor:pointer;transition:var(--transition);line-height:1;padding:0 4px;}
        .modal-close:hover{color:var(--danger);}
        .modal-body{padding:20px 24px;overflow-y:auto;}
        .modal-search{margin-bottom:16px;}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border-color);display:flex;gap:10px;justify-content:flex-end;align-items:center;}

        .login-modal{text-align:center;padding:40px;max-width:420px;}
        .modal-logo{margin-bottom:20px;}
        .modal-logo svg{filter:drop-shadow(0 0 12px rgba(0,232,252,0.5));}
        .login-modal h2{font-family:'Orbitron',sans-serif;color:var(--accent-primary);font-size:20px;letter-spacing:3px;margin-bottom:8px;}
        .login-modal p{color:var(--text-muted);margin-bottom:24px;font-size:15px;}
        .login-modal input{width:100%;background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:16px;padding:12px 16px;border-radius:var(--radius-md);margin-bottom:16px;outline:none;text-align:center;letter-spacing:1px;transition:var(--transition);}
        .login-modal input:focus{border-color:var(--accent-primary);box-shadow:0 0 0 2px var(--accent-glow);}
        .login-modal .btn-primary{width:100%;justify-content:center;padding:14px;font-size:16px;}

        .add-item-list{display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto;}
        .add-item-option{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);gap:8px;}
        .add-item-option:hover{border-color:var(--accent-primary);background:var(--bg-card-hover);}
        .add-item-option.in-inventory{border-color:rgba(76,175,80,0.2);background:var(--success-bg);}
        .add-item-option-name{font-size:14px;font-weight:600;color:var(--text-primary);}
        .add-item-option-sub{font-size:11px;color:var(--text-muted);}
        .add-item-option-btn{padding:4px 12px;border-radius:var(--radius-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:var(--transition);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}
        .add-item-option-btn.add{background:var(--accent-primary);color:var(--bg-primary);}
        .add-item-option-btn.remove{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(244,67,54,0.2);}

        .recipe-detail-modal{max-width:650px;}
        .recipe-detail-category{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;}
        .recipe-detail-progress{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px;background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border-color);}
        .recipe-detail-progress-bar{flex:1;height:10px;background:var(--bg-primary);border-radius:5px;overflow:hidden;}
        .recipe-detail-progress-fill{height:100%;border-radius:5px;transition:width 0.5s ease;}
        .recipe-detail-progress-text{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--text-primary);white-space:nowrap;}
        .recipe-detail-items{display:flex;flex-direction:column;gap:8px;}
        .recipe-detail-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);transition:var(--transition);flex-wrap:wrap;gap:8px;}
        .recipe-detail-item.owned{border-color:rgba(76,175,80,0.27);background:var(--success-bg);}
        .recipe-detail-item-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
        .recipe-detail-item-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.5px;text-transform:uppercase;}
        .recipe-detail-item-status.owned{background:var(--success-bg);color:var(--success);}
        .recipe-detail-item-status.missing{background:var(--danger-bg);color:var(--danger);}
        .toggle-btn{padding:4px 12px;border-radius:var(--radius-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:var(--transition);text-transform:uppercase;margin-left:8px;}
        .toggle-btn.add-inv{background:var(--accent-primary);color:var(--bg-primary);}
        .toggle-btn.remove-inv{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(244,67,54,0.2);}

        /* CRAFT SECTION IN DETAIL */

        /* CRAFT SWITCH */
        .craft-switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
        .craft-switch-track{width:44px;height:24px;border-radius:12px;background:var(--bg-tertiary);border:2px solid var(--border-color);position:relative;transition:var(--transition);}
        .craft-switch-track.on{background:var(--crafted-red);border-color:var(--crafted-red);}

        .craft-switch-label{font-size:13px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;transition:var(--transition);}

        .import-export-section{margin-bottom:24px;}

        .backup-info{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;margin-bottom:20px;}

        .backup-info p{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
        .backup-slots{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
        .backup-slot-btn{padding:6px 14px;border-radius:var(--radius-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;transition:var(--transition);}
        .backup-slot-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary);}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--bg-secondary);border:1px solid var(--accent-primary);border-radius:var(--radius-md);color:var(--text-primary);font-size:14px;font-weight:600;z-index:2000;box-shadow:var(--shadow-glow),var(--shadow-md);animation:toastIn 0.3s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
        .toast.hidden{display:none;}
        .toast.success{border-color:var(--success);}

        .toast.craft{border-color:var(--crafted-red);box-shadow:var(--crafted-red-glow),var(--shadow-md);}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}

        @media(max-width:768px){.header-content{padding:10px 16px;}.logo h1{font-size:13px;letter-spacing:1.5px;}.nav-tabs{padding:0 16px;}.nav-tab{padding:10px 16px;font-size:13px;letter-spacing:1px;}.tab-content{padding:16px;}.controls-bar{flex-direction:column;}.search-box{width:100%;}.filter-group{width:100%;}.filter-select{flex:1;}.btn-add{flex:1;justify-content:center;}.recipes-grid{grid-template-columns:1fr;}.recipes-stats,.inventory-stats{flex-direction:column;}.stat-card{min-width:auto;}.modal-content{max-height:90vh;}.login-modal{padding:30px 24px;}}
        @media(max-width:480px){.logo-icon{width:30px;height:30px;}.logo h1{font-size:11px;}.user-name{display:none;}.backup-indicator{display:none;}}
    </style>
</head>

<script>
(function(){
'use strict';

let RECIPES=[],ALL_COMPONENTS=[],COMP_MAP={},API_LOADED=false,API_SOURCE='';
const MAX_BACKUPS=5;

// ===== API =====
class WarframeAPI{
    static async fetchFromGitHub(){const r=await fetch('https://raw.githubusercontent.com/WFCD/warframe-items/master/data/json/All.json');if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
    static async fetchFromWarframeStat(){const r=await fetch('https://api.warframestat.us/items');if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
    static mapCategory(item){const c=(item.category||'').toLowerCase(),t=(item.type||'').toLowerCase(),n=item.name||'',p=n.includes('Prime');if(c==='warframes'||t==='warframe')return p?'Warframe Prime':'Warframe';if(c==='primary'||t==='primary')return p?'Arma Primária Prime':'Arma Primária';if(c==='secondary'||t==='secondary')return p?'Arma Secundária Prime':'Arma Secundária';if(c==='melee'||t==='melee')return p?'Corpo a Corpo Prime':'Corpo a Corpo';if(c==='sentinels'||t==='sentinel')return p?'Sentinela Prime':'Sentinela';if(c==='archwing'||t==='archwing')return p?'Archwing Prime':'Archwing';if(c==='pets'||t==='pet')return'Companheiro';if(c==='necramechs')return'Necramech';return'Outro';}
    static isGenericResource(n){const l=n.toLowerCase();return['credits','orokin cell','neurodes','morphics','control module','gallium','neural sensors','neurode','plastids','polymer bundle','rubedo','salvage','ferrite','nano spores','alloy plate','circuits','oxium','cryotic','argon crystal','tellurium','nitain extract','forma','kuva','void traces','detonite injector','fieldron','mutagen mass','pherliac pod','thermia','cubic diodes','carbides','copernics','bracoids','thaumica','namalon','hesperon','travocyte','pustulite','ganglion','scintillant','entrati lanthorn','voidplume quill','voidplume down','voidplume crest','voidplume pinion','lucent teroglobe'].includes(l);}
    static parseRecipes(items){const recipes=[],seen=new Set();const validC=['warframes','primary','secondary','melee','sentinels','archwing','necramechs','pets'];const validT=['warframe','primary','secondary','melee','sentinel','archwing','pet','necramech','arch-gun','arch-melee'];items.forEach(item=>{if(!item.components||!item.components.length||!item.name)return;const c=(item.category||'').toLowerCase(),t=(item.type||'').toLowerCase();if(!validC.includes(c)&&!validT.includes(t))return;if(seen.has(item.name))return;seen.add(item.name);const pn=item.name;const comps=[];item.components.forEach(comp=>{const rn=comp.name||comp.itemName||'';if(!rn||/^\d+$/.test(rn.trim())||this.isGenericResource(rn))return;const id=`${pn}::${rn}`;let dn=rn.toLowerCase().includes(pn.toLowerCase())||pn.toLowerCase().includes(rn.toLowerCase())?rn:`${pn} ${rn}`;comps.push({id,displayName:dn,rawName:rn});});if(comps.length<2)return;recipes.push({name:pn,category:this.mapCategory(item),components:comps,wikiaUrl:item.wikiaUrl||null,description:item.description||''});});recipes.sort((a,b)=>a.name.localeCompare(b.name));return recipes;}
    static buildComponentMaps(recipes){const ac=[],cm={};recipes.forEach(r=>{r.components.forEach(c=>{if(!cm[c.id]){cm[c.id]={displayName:c.displayName,parentName:r.name,rawName:c.rawName};ac.push({id:c.id,displayName:c.displayName,parentName:r.name});}});});ac.sort((a,b)=>a.displayName.localeCompare(b.displayName));return{allComps:ac,compMap:cm};}
    static getCategories(r){const s=new Set();r.forEach(x=>s.add(x.category));return Array.from(s).sort();}
}

// ===== STORAGE =====
class StorageManager{
    static setLS(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true;}catch(e){return false;}}
    static getLS(k){try{return localStorage.getItem(k);}catch(e){return null;}}
    static _openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('WFCraft3',1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('data'))db.createObjectStore('data',{keyPath:'key'});};r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);});}
    static async saveIDB(k,v){try{const db=await this._openDB();const tx=db.transaction('data','readwrite');tx.objectStore('data').put({key:k,value:v,ts:Date.now()});await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j;});}catch(e){}}
    static async loadIDB(k){try{const db=await this._openDB();const tx=db.transaction('data','readonly');const req=tx.objectStore('data').get(k);return new Promise(r=>{req.onsuccess=()=>r(req.result?req.result.value:null);req.onerror=()=>r(null);});}catch(e){return null;}}
}

// ===== INVENTORY MANAGER =====
class InventoryManager{
    constructor(){this.currentUser=null;this.inventory={};this.crafted={};this._dirty=false;this._lastHash='';}
    _key(){return`wf_inv3_${this.currentUser}`;}
    _craftedKey(){return`wf_crafted_${this.currentUser}`;}
    _bkKey(s){return`wf_bk3_${this.currentUser}_${s}`;}
    _hash(){return JSON.stringify(this.inventory)+JSON.stringify(this.crafted);}

    loadUser(u){
        this.currentUser=u.toLowerCase().trim();
        let d=StorageManager.getLS(this._key());
        try{this.inventory=d?JSON.parse(d):{};}catch(e){this.inventory={};}
        d=StorageManager.getLS(this._craftedKey());
        try{this.crafted=d?JSON.parse(d):{};}catch(e){this.crafted={};}
        if(!Object.keys(this.inventory).length)this._recoverIDB();
        StorageManager.setLS('wf_last_user',this.currentUser);
        this._lastHash=this._hash();this._dirty=false;
    }
    async _recoverIDB(){const d=await StorageManager.loadIDB(`inv3_${this.currentUser}`);if(d&&d.inventory&&Object.keys(d.inventory).length){this.inventory=d.inventory;this.crafted=d.crafted||{};this.save();}}
    save(){
        if(!this.currentUser)return;
        StorageManager.setLS(this._key(),JSON.stringify(this.inventory));
        StorageManager.setLS(this._craftedKey(),JSON.stringify(this.crafted));
        StorageManager.saveIDB(`inv3_${this.currentUser}`,{inventory:this.inventory,crafted:this.crafted});
        const h=this._hash();if(h!==this._lastHash){this._dirty=true;this._lastHash=h;}
        StorageManager.setLS(`wf_lastsave_${this.currentUser}`,Date.now().toString());
    }
    createBackup(){
        if(!this.currentUser)return;
        const bd=JSON.stringify({inventory:this.inventory,crafted:this.crafted,ts:Date.now(),count:Object.keys(this.inventory).length});
        for(let i=MAX_BACKUPS-1;i>0;i--){const p=StorageManager.getLS(this._bkKey(i-1));if(p)StorageManager.setLS(this._bkKey(i),p);}
        StorageManager.setLS(this._bkKey(0),bd);this._dirty=false;
    }
    getBackups(){const b=[];for(let i=0;i<MAX_BACKUPS;i++){const d=StorageManager.getLS(this._bkKey(i));if(d){try{const p=JSON.parse(d);p.slot=i;b.push(p);}catch(e){}}}return b;}
    restoreBackup(s){const d=StorageManager.getLS(this._bkKey(s));if(!d)return false;try{const p=JSON.parse(d);if(p.inventory){this.createBackup();this.inventory=p.inventory;this.crafted=p.crafted||{};this.save();return true;}}catch(e){}return false;}
    getLastSave(){const t=StorageManager.getLS(`wf_lastsave_${this.currentUser}`);return t?parseInt(t):null;}
    hasItem(id){return(this.inventory[id]||0)>0;}
    getQty(id){return this.inventory[id]||0;}
    addItem(id,q=1){this.inventory[id]=(this.inventory[id]||0)+q;this.save();}
    removeItem(id){delete this.inventory[id];this.save();}
    setQty(id,q){if(q<=0)delete this.inventory[id];else this.inventory[id]=q;this.save();}
    getAllItems(){return Object.entries(this.inventory).filter(([_,q])=>q>0).map(([id,quantity])=>({id,quantity})).sort((a,b)=>{const da=COMP_MAP[a.id]?.displayName||a.id;const db=COMP_MAP[b.id]?.displayName||b.id;return da.localeCompare(db);});}

    // CRAFTED STATE
    isCrafted(recipeName){return!!this.crafted[recipeName];}
    getCraftedTime(recipeName){return this.crafted[recipeName]||null;}
    setCrafted(recipeName){this.crafted[recipeName]=Date.now();this.save();}
    unsetCrafted(recipeName){delete this.crafted[recipeName];this.save();}

    // RECIPE PROGRESS
    getRecipeProgress(recipe){
        const total=recipe.components.length;let owned=0;
        const details=recipe.components.map(c=>{const has=this.hasItem(c.id);if(has)owned++;return{id:c.id,displayName:c.displayName,rawName:c.rawName,owned:has,quantity:this.getQty(c.id)};});
        // Can craft = all components have qty >= 1
        const canCraft=details.every(d=>d.quantity>=1);
        // How many times can craft
        let maxCrafts=canCraft?Infinity:0;
        if(canCraft)details.forEach(d=>{maxCrafts=Math.min(maxCrafts,d.quantity);});
        if(!isFinite(maxCrafts))maxCrafts=0;
        return{total,owned,details,percentage:total>0?(owned/total)*100:0,canCraft,maxCrafts};
    }

    // CRAFT ACTION: remove 1 of each component
    craftRecipe(recipe){
        const progress=this.getRecipeProgress(recipe);
        if(!progress.canCraft)return false;
        recipe.components.forEach(c=>{
            const current=this.getQty(c.id);
            this.setQty(c.id,current-1);
        });
        this.setCrafted(recipe.name);
        this.save();
        return true;
    }

    // UNCRAFT: restore 1 of each component
    uncraftRecipe(recipe){
        recipe.components.forEach(c=>{
            this.addItem(c.id,1);
        });
        this.unsetCrafted(recipe.name);
        this.save();
        return true;
    }

    findRecipesUsing(id){return RECIPES.filter(r=>r.components.some(c=>c.id===id));}
    exportData(){return JSON.stringify({user:this.currentUser,inventory:this.inventory,crafted:this.crafted,count:Object.keys(this.inventory).length,date:new Date().toISOString(),version:4},null,2);}
    importData(json){try{const d=JSON.parse(json);if(d.inventory&&typeof d.inventory==='object'){this.createBackup();this.inventory=d.inventory;this.crafted=d.crafted||{};this.save();return true;}}catch(e){}return false;}
    isDirty(){return this._dirty;}
    static getLastUser(){return StorageManager.getLS('wf_last_user');}
}

// ===== LOAD API =====
async function loadAPI(force=false){
    setProgress(5,'Verificando cache...');
    if(!force){const cached=getCachedRecipes();if(cached&&cached.length){RECIPES=cached;const m=WarframeAPI.buildComponentMaps(RECIPES);ALL_COMPONENTS=m.allComps;COMP_MAP=m.compMap;API_SOURCE='cache';API_LOADED=true;setProgress(100,`${RECIPES.length} receitas (cache)`);return true;}}
    setProgress(10,'Conectando ao GitHub...');
    try{setProgress(20,'Baixando...');const raw=await WarframeAPI.fetchFromGitHub();setProgress(60,`Processando ${raw.length} itens...`);RECIPES=WarframeAPI.parseRecipes(raw);const m=WarframeAPI.buildComponentMaps(RECIPES);ALL_COMPONENTS=m.allComps;COMP_MAP=m.compMap;API_SOURCE='github';API_LOADED=true;setProgress(90,`${RECIPES.length} receitas!`);cacheRecipes(RECIPES);setProgress(100,'OK!');return true;}catch(e){console.warn('GitHub:',e);}
    setProgress(30,'Tentando alternativa...');
    try{const raw=await WarframeAPI.fetchFromWarframeStat();setProgress(60,`Processando...`);RECIPES=WarframeAPI.parseRecipes(raw);const m=WarframeAPI.buildComponentMaps(RECIPES);ALL_COMPONENTS=m.allComps;COMP_MAP=m.compMap;API_SOURCE='warframestat';API_LOADED=true;cacheRecipes(RECIPES);setProgress(100,'OK!');return true;}catch(e){}
    try{const old=StorageManager.getLS('wf_rc3');if(old){RECIPES=JSON.parse(old);const m=WarframeAPI.buildComponentMaps(RECIPES);ALL_COMPONENTS=m.allComps;COMP_MAP=m.compMap;API_SOURCE='cache-expired';API_LOADED=true;setProgress(100,'Cache antigo');return true;}}catch(e){}

}

// ===== RECIPES =====
function renderRecipes(){
    const s=normalize(el.recipeSearch.value);const cf=el.categoryFilter.value;const pf=el.progressFilter.value;
    let f=RECIPES.filter(r=>{
        if(s&&!normalize(r.name).includes(s))return false;
        if(cf!=='all'&&r.category!==cf)return false;
        if(pf!=='all'){
            const p=inv.getRecipeProgress(r);const isCrafted=inv.isCrafted(r.name);
            if(pf==='complete'&&p.percentage!==100)return false;
            if(pf==='partial'&&(p.percentage===0||p.percentage===100))return false;
            if(pf==='none'&&p.percentage!==0)return false;
            if(pf==='craftable'&&!p.canCraft)return false;
            if(pf==='crafted'&&!isCrafted)return false;
        }
        return true;
    });
    f.sort((a,b)=>{
        const ca=inv.isCrafted(a.name),cb=inv.isCrafted(b.name);
        if(ca&&!cb)return 1;if(cb&&!ca)return-1;
        const pa=inv.getRecipeProgress(a).percentage,pb=inv.getRecipeProgress(b).percentage;
        if(pa===100&&pb!==100)return 1;if(pb===100&&pa!==100)return-1;
        if(pb!==pa)return pb-pa;
        return a.name.localeCompare(b.name);
    });
    el.recipesGrid.innerHTML='';
    if(!f.length){el.recipesGrid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><h3>Nenhuma receita encontrada</h3><p>Ajuste os filtros</p></div>`;return;}

    f.forEach(recipe=>{
        const pr=inv.getRecipeProgress(recipe);const isPrime=recipe.name.includes('Prime');const pct=pr.percentage;const isCrafted=inv.isCrafted(recipe.name);
        let bc,bt;
        if(isCrafted){bc='none';bt='Fabricado';}
        else if(pct===100){bc='complete';bt='Completo';}
        else if(pct>0){bc='partial';bt='Parcial';}
        else{bc='none';bt='Faltam todos';}
        let fc;if(isPrime)fc=pct===100?'gold':pct>0?'orange':'red';else fc=pct===100?'green':pct>0?'orange':'red';
        const tags=pr.details.map(d=>{let l=d.rawName||d.displayName;if(l.length>20)l=l.substring(0,17)+'...';return`<span class="recipe-item-tag${d.owned?' owned':''}">${d.owned?'<span class="check">✓</span>':''}${l}${d.quantity>1?' <small>x'+d.quantity+'</small>':''}</span>`;}).join('');

        const card=document.createElement('div');
        card.className=`recipe-card${isPrime?' prime':''}${isCrafted?' crafted':''}`;
        card.innerHTML=`
            <div class="recipe-card-header">
                <div><div class="recipe-name">${recipe.name}</div><div class="recipe-category">${recipe.category}</div></div>
                <div class="recipe-header-badges">
                    <span class="crafted-badge ${isCrafted?'is-crafted':'not-crafted'}" data-recipe="${recipe.name}" title="${isCrafted?'Clique para desmarcar fabricação':'Clique para marcar como fabricado'}">${isCrafted?'🔨 FABRICADO':'🔨'}</span>
                    <span class="recipe-badge ${bc}">${bt}</span>
                </div>
            </div>
            <div class="recipe-card-body">
                <div class="recipe-progress-bar"><div class="recipe-progress-fill ${fc}" style="width:${pct}%"></div></div>
                <div class="recipe-items-preview">${tags}</div>
                <div class="recipe-counter">${pr.owned}/${pr.total}</div>
            </div>
            ${!isCrafted&&pr.maxCrafts>0?`<div class="recipe-card-footer"><div class="craft-count-badge">Pode fabricar: <strong>${pr.maxCrafts}x</strong></div></div>`:''}`;

        // Crafted badge click (switch)
        card.querySelector('.crafted-badge').addEventListener('click',e=>{
            e.stopPropagation();
            if(isCrafted){
                // UNCRAFT: devolve itens
                if(confirm(`Desmarcar "${recipe.name}" como fabricado?\n\nOs componentes serão devolvidos ao inventário.`)){
                    inv.uncraftRecipe(recipe);
                    showToast(`${recipe.name} desmarcado — itens devolvidos`,'error');
                    renderAll();
                }
            } else {
                // CRAFT: precisa ter todos os itens
                if(!pr.canCraft){
                    showToast(`Faltam componentes para fabricar ${recipe.name}!`,'error');
                    return;
                }
                if(confirm(`Fabricar "${recipe.name}"?\n\nIsso removerá 1 unidade de cada componente do inventário:\n${recipe.components.map(c=>'• '+c.displayName).join('\n')}`)){
                    inv.craftRecipe(recipe);
                    showToast(`🔨 ${recipe.name} fabricado!`,'craft');
                    renderAll();
                }
            }
        });

        // Card click opens detail
        card.addEventListener('click',e=>{
            if(e.target.closest('.crafted-badge'))return;
            openDetail(recipe);
        });
        el.recipesGrid.appendChild(card);
    });
}

function renderRecipeStats(){
    let total=RECIPES.length,comp=0,part=0,tc=0,oc=0,crafted=0,craftable=0;
    RECIPES.forEach(r=>{const p=inv.getRecipeProgress(r);tc+=p.total;oc+=p.owned;if(inv.isCrafted(r.name))crafted++;else if(p.canCraft)craftable++;if(p.percentage===100)comp++;else if(p.percentage>0)part++;});
    el.recipesStats.innerHTML=`
        <div class="stat-card"><div class="stat-icon blue">📋</div><div class="stat-info"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-info"><div class="stat-value">${comp}</div><div class="stat-label">Completas</div></div></div>
        <div class="stat-card"><div class="stat-icon orange">🔶</div><div class="stat-info"><div class="stat-value">${craftable}</div><div class="stat-label">Fabricáveis</div></div></div>
        <div class="stat-card"><div class="stat-icon red">🔨</div><div class="stat-info"><div class="stat-value">${crafted}</div><div class="stat-label">Fabricados</div></div></div>

}

// ===== DETAIL =====
function openDetail(recipe){
    const pr=inv.getRecipeProgress(recipe);const isPrime=recipe.name.includes('Prime');const pct=pr.percentage;const isCrafted=inv.isCrafted(recipe.name);
    let fc;if(isPrime)fc=pct===100?'gold':pct>0?'orange':'red';else fc=pct===100?'green':pct>0?'orange':'red';
    let h=`<div style="margin-bottom:16px;"><div class="recipe-detail-category">${recipe.category}</div>${recipe.description?`<p style="color:var(--text-muted);font-size:13px;margin-top:6px;">${recipe.description}</p>`:''}</div>
        <div class="recipe-detail-progress"><div class="recipe-detail-progress-bar"><div class="recipe-detail-progress-fill ${fc}" style="width:${pct}%"></div></div><div class="recipe-detail-progress-text">${pr.owned}/${pr.total}</div></div>
        <div class="recipe-detail-items">`;
    pr.details.forEach(it=>{
        h+=`<div class="recipe-detail-item ${it.owned?'owned':'missing'}">
            <div class="recipe-detail-item-name">${it.owned?'✓':'✗'} ${it.displayName}${it.quantity>1?` <span style="color:var(--accent-primary);font-size:12px;font-family:Orbitron;">(x${it.quantity})</span>`:''}</div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="recipe-detail-item-status ${it.owned?'owned':'missing'}">${it.owned?`${it.quantity} no inv.`:'Faltando'}</span>
                <button class="toggle-btn ${it.owned?'remove-inv':'add-inv'}" data-comp-id="${it.id}" data-action="${it.owned?'remove':'add'}">${it.owned?'Remover':'Adicionar'}</button>
            </div></div>`;
    });
    h+=`</div>`;

    // CRAFT SECTION
    const craftClass=isCrafted?'is-crafted':pr.canCraft?'can-craft':'';
    const titleClass=isCrafted?'crafted':pr.canCraft?'available':'unavailable';
    const titleText=isCrafted?'🔨 FABRICADO':pr.canCraft?'⚡ PRONTO PARA FABRICAR':'🔒 COMPONENTES FALTANDO';

    h+=`<div class="craft-section ${craftClass}">
        <div class="craft-section-header">
            <div class="craft-section-title ${titleClass}">${titleText}</div>
            ${!isCrafted&&pr.maxCrafts>0?`<div class="craft-possible">Fabricações possíveis: <strong>${pr.maxCrafts}x</strong></div>`:''}
        </div>`;

    if(isCrafted){
        const craftTime=inv.getCraftedTime(recipe.name);
        h+=`<div class="crafted-status">
            <div><div class="crafted-status-text">✅ Item fabricado</div><div class="crafted-status-time">Fabricado em: ${craftTime?new Date(craftTime).toLocaleString('pt-BR'):'Data desconhecida'}</div></div>
        </div>
        <div class="craft-actions" style="margin-top:12px;">
            <button class="btn-primary btn-warning" id="btnUncraft">↩️ DESFAZER FABRICAÇÃO</button>
        </div>
        <div class="craft-warning">⚠️ Desfazer devolverá 1 de cada componente ao inventário</div>`;
    } else if(pr.canCraft){
        h+=`<div class="craft-actions">
            <button class="btn-primary btn-danger" id="btnCraft">🔨 FABRICAR</button>
        </div>
        <div class="craft-warning">⚠️ Fabricar removerá 1 unidade de cada componente do inventário</div>`;
    } else {
        h+=`<div style="font-size:13px;color:var(--text-muted);">Adicione todos os componentes ao inventário para poder fabricar.</div>`;
    }
    h+=`</div>`;

    if(recipe.wikiaUrl)h+=`<div style="margin-top:16px;text-align:center;"><a href="${recipe.wikiaUrl}" target="_blank" rel="noopener" style="color:var(--accent-primary);font-size:13px;text-decoration:none;">📖 Wiki</a></div>`;

    el.recipeDetailTitle.textContent=recipe.name;
    el.recipeDetailBody.innerHTML=h;
    el.recipeDetailModal.classList.remove('hidden');

    // Toggle buttons
    el.recipeDetailBody.querySelectorAll('.toggle-btn').forEach(btn=>{
        btn.addEventListener('click',e=>{e.stopPropagation();const id=btn.dataset.compId;const dn=COMP_MAP[id]?.displayName||id;if(btn.dataset.action==='add'){inv.addItem(id,1);showToast(`${dn} adicionado!`);}else{inv.removeItem(id);showToast(`${dn} removido`,'error');}openDetail(recipe);renderAll();});
    });

    // Craft button
    const btnCraft=el.recipeDetailBody.querySelector('#btnCraft');
    if(btnCraft){
        btnCraft.addEventListener('click',()=>{
            if(confirm(`Fabricar "${recipe.name}"?\n\nRemoverá 1 de cada componente:`)){
                inv.craftRecipe(recipe);
                showToast(`🔨 ${recipe.name} fabricado!`,'craft');
                openDetail(recipe);renderAll();
            }
        });
    }

    // Uncraft button
    const btnUncraft=el.recipeDetailBody.querySelector('#btnUncraft');
    if(btnUncraft){
        btnUncraft.addEventListener('click',()=>{
            if(confirm(`Desfazer fabricação de "${recipe.name}"?\n\nDevolverá 1 de cada componente ao inventário.`)){
                inv.uncraftRecipe(recipe);
                showToast(`${recipe.name} desmarcado — itens devolvidos`,'error');
                openDetail(recipe);renderAll();
            }
        });
    }
}

function renderInventory(){

    el.inventoryList.innerHTML='';
    if(!items.length){el.inventoryList.innerHTML=`<div class="empty-state"><h3>Inventário vazio</h3><p>Clique em "Adicionar Item"</p></div>`;return;}
    items.forEach(item=>{
        const info=COMP_MAP[item.id]||{displayName:item.id,parentName:'?'};const recipes=inv.findRecipesUsing(item.id);
        const rt=recipes.length?`Receita: ${recipes.map(r=>r.name).join(', ')}`:'Sem receita';
        const div=document.createElement('div');div.className='inventory-item';
        div.innerHTML=`<div class="inventory-item-info"><div class="inventory-item-name">${info.displayName}</div><div class="inventory-item-parent">📦 ${info.parentName}</div><div class="inventory-item-recipes">${rt}</div></div>

el.btnImportExport.addEventListener('click',()=>{el.exportData.value=inv.exportData();el.importData.value='';renderBackupInfo();el.importExportModal.classList.remove('hidden');});
el.btnCopyExport.addEventListener('click',()=>{el.exportData.select();navigator.clipboard.writeText(el.exportData.value).then(()=>showToast('Copiado!')).catch(()=>{document.execCommand('copy');showToast('Copiado!');});});
el.btnImport.addEventListener('click',()=>{const d=el.importData.value.trim();if(!d){showToast('Cole seus dados','error');return;}if(inv.importData(d)){showToast('Importado!');el.importExportModal.classList.add('hidden');renderAll();}else showToast('Formato inválido','error');});
el.btnRefreshApi.addEventListener('click',async()=>{showToast('Atualizando...');el.loadingScreen.classList.remove('hidden');el.loadingScreen.style.opacity='1';const ok=await loadAPI(true);if(ok){populateCategories();renderAll();updateApiStatus();showToast(`${RECIPES.length} receitas atualizadas!`);}else showToast('Falha','error');el.loadingScreen.classList.add('hidden');});
document.querySelectorAll('.modal-close').forEach(btn=>{btn.addEventListener('click',()=>document.getElementById(btn.dataset.close).classList.add('hidden'));});
document.querySelectorAll('.modal').forEach(modal=>{modal.addEventListener('click',e=>{if(e.target===modal&&modal.id!=='loginModal')modal.classList.add('hidden');});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal:not(.hidden)').forEach(m=>{if(m.id!=='loginModal')m.classList.add('hidden');});});
setInterval(()=>{if(inv.currentUser&&inv.isDirty()){inv.createBackup();updateBackupBadge();}},60000);
window.addEventListener('beforeunload',()=>{if(inv.currentUser){inv.save();if(inv.isDirty())inv.createBackup();}});

// ===== BOOT =====
async function boot(){
    setProgress(0,'Inicializando...');const ok=await loadAPI();
    if(!ok){el.loadingError.style.display='block';el.loadingError.innerHTML=`<p>⚠️ Sem dados.</p><button onclick="location.reload()">TENTAR</button>`;return;}
    populateCategories();updateApiStatus();
    const last=InventoryManager.getLastUser();
    if(last){inv.loadUser(last);el.userName.textContent=last.toUpperCase();}else el.loginModal.classList.remove('hidden');
    setTimeout(()=>{el.loadingScreen.classList.add('hidden');el.app.style.display='block';renderAll();if(inv.currentUser&&inv.getAllItems().length)inv.createBackup();},600);
}
boot();
})();
</script>
</body>
</html>
