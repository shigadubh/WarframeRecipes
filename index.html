<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Craft Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #111820;
            --bg-tertiary: #1a2230;
            --bg-card: #151d28;
            --bg-card-hover: #1c2737;
            --bg-input: #0d1117;
            --border-color: #1e2d3d;
            --border-accent: #00e8fc33;
            --text-primary: #e0e6ed;
            --text-secondary: #8899aa;
            --text-muted: #556677;
            --accent-primary: #00e8fc;
            --accent-secondary: #00bcd4;
            --accent-glow: #00e8fc33;
            --success: #4caf50;
            --success-bg: #4caf5022;
            --warning: #ff9800;
            --warning-bg: #ff980022;
            --danger: #f44336;
            --danger-bg: #f4433622;
            --gold: #ffd700;
            --gold-bg: #ffd70015;
            --prime-gold: #c4a24e;
            --prime-gold-light: #e8d48b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(0,232,252,0.15);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: 0.2s ease;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 16px;
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0,232,252,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0,188,212,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        #app { position: relative; z-index: 1; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            width: 80px; height: 80px;
            margin-bottom: 24px;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0,232,252,0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(0,232,252,0.7)); }
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-primary);
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .loading-status {
            font-size: 13px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .loading-error {
            color: var(--warning);
            font-size: 13px;
            margin-top: 12px;
            max-width: 400px;
            text-align: center;
        }

        .loading-error button {
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            filter: drop-shadow(0 0 8px rgba(0,232,252,0.4));
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0,232,252,0.4)); }
            50% { filter: drop-shadow(0 0 16px rgba(0,232,252,0.6)); }
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0,232,252,0.3);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-small {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
        }

        .btn-small:hover {
            background: var(--bg-card-hover);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .api-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .api-status.online {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid var(--success)44;
        }

        .api-status.offline {
            background: var(--warning-bg);
            color: var(--warning);
            border: 1px solid var(--warning)44;
        }

        /* ===== NAV TABS ===== */
        .nav-tabs {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            text-transform: uppercase;
        }

        .nav-tab::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: transparent;
            transition: var(--transition);
        }

        .nav-tab:hover { color: var(--text-secondary); }

        .nav-tab.active { color: var(--accent-primary); }

        .nav-tab.active::after {
            background: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0,232,252,0.5);
        }

        .nav-tab svg { opacity: 0.7; }
        .nav-tab.active svg { opacity: 1; stroke: var(--accent-primary); }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== CONTROLS BAR ===== */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            flex: 1;
            min-width: 200px;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .search-box svg { stroke: var(--text-muted); flex-shrink: 0; }

        .search-box input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            outline: none;
        }

        .filter-select:hover,
        .filter-select:focus { border-color: var(--accent-primary); }

        .filter-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .btn-warning { background: linear-gradient(135deg, var(--warning), #e68900); }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-danger-outline:hover { background: var(--danger-bg); }

        /* ===== STATS BAR ===== */
        .recipes-stats, .inventory-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 150px;
        }

        .stat-icon {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.blue { background: var(--accent-glow); }
        .stat-icon.green { background: var(--success-bg); }
        .stat-icon.orange { background: var(--warning-bg); }
        .stat-icon.gold { background: var(--gold-bg); }

        .stat-info { display: flex; flex-direction: column; }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== RECIPES GRID ===== */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .recipe-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .recipe-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .recipe-card.prime { border-color: rgba(196,162,78,0.2); }
        .recipe-card.prime:hover {
            border-color: var(--prime-gold);
            box-shadow: 0 0 20px rgba(196,162,78,0.15);
        }

        .recipe-card-header {
            padding: 16px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .recipe-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .recipe-card.prime .recipe-name { color: var(--prime-gold-light); }

        .recipe-category {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .recipe-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .recipe-badge.complete { background: var(--success-bg); color: var(--success); border: 1px solid rgba(76,175,80,0.27); }
        .recipe-badge.partial { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(255,152,0,0.27); }
        .recipe-badge.none { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(244,67,54,0.27); }

        .recipe-card-body { padding: 6px 18px 14px; }

        .recipe-progress-bar {
            width: 100%; height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .recipe-progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .recipe-progress-fill.green { background: linear-gradient(90deg, var(--success), #66bb6a); }
        .recipe-progress-fill.orange { background: linear-gradient(90deg, var(--warning), #ffb74d); }
        .recipe-progress-fill.red { background: linear-gradient(90deg, var(--danger), #e57373); }
        .recipe-progress-fill.gold { background: linear-gradient(90deg, var(--prime-gold), var(--prime-gold-light)); }

        .recipe-items-preview { display: flex; flex-wrap: wrap; gap: 6px; }

        .recipe-item-tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 3px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .recipe-item-tag.owned {
            border-color: rgba(76,175,80,0.27);
            color: var(--success);
            background: var(--success-bg);
        }

        .recipe-item-tag .check { font-size: 10px; }

        .recipe-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 6px;
        }

        .recipe-thumb {
            width: 48px; height: 48px;
            border-radius: var(--radius-sm);
            object-fit: contain;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        /* ===== INVENTORY LIST ===== */
        .inventory-list { display: flex; flex-direction: column; gap: 8px; }

        .inventory-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .inventory-item:hover {
            border-color: var(--border-accent);
            background: var(--bg-card-hover);
        }

        .inventory-item-info { display: flex; flex-direction: column; }

        .inventory-item-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .inventory-item-recipes {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .inventory-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .quantity-btn {
            width: 32px; height: 32px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .quantity-btn:hover { background: var(--accent-primary); color: var(--bg-primary); }

        .quantity-value {
            width: 40px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--accent-primary);
            font-weight: 600;
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFade 0.2s ease;
            padding: 20px;
        }

        .modal.hidden { display: none; }

        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--accent-primary);
            letter-spacing: 2px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
            padding: 0 4px;
        }

        .modal-close:hover { color: var(--danger); }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
        }

        .modal-search { margin-bottom: 16px; }

        /* Login Modal */
        .login-modal {
            text-align: center;
            padding: 40px;
            max-width: 420px;
        }

        .modal-logo { margin-bottom: 20px; }
        .modal-logo svg { filter: drop-shadow(0 0 12px rgba(0,232,252,0.5)); }

        .login-modal h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-primary);
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .login-modal p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .login-modal input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .login-modal input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .login-modal .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
        }

        /* ===== ADD ITEM LIST ===== */
        .add-item-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 400px;
            overflow-y: auto;
        }

        .add-item-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .add-item-option:hover {
            border-color: var(--accent-primary);

<script>
// =====================================================
// ===== WARFRAME CRAFT TRACKER - FULL APPLICATION =====
// =====================================================

(function() {
'use strict';

// ===== GLOBAL STATE =====
let RECIPES = [];
let ALL_COMPONENTS = [];
let API_LOADED = false;
let API_SOURCE = '';

// ===== API DATA FETCHER =====
class WarframeAPI {

    // Primary: warframe-items GitHub (most complete)
    static async fetchFromGitHub() {
        const url = 'https://raw.githubusercontent.com/WFCD/warframe-items/master/data/json/All.json';
        const response = await fetch(url);
        if (!response.ok) throw new Error(`GitHub HTTP ${response.status}`);
        return await response.json();
    }

    // Secondary: WarframeStat.us API
    static async fetchFromWarframeStat() {
        const url = 'https://api.warframestat.us/items';
        const response = await fetch(url);
        if (!response.ok) throw new Error(`WarframeStat HTTP ${response.status}`);
        return await response.json();
    }

    // Map category from API data
    static mapCategory(item) {
        const cat = (item.category || '').toLowerCase();
        const type = (item.type || '').toLowerCase();
        const name = item.name || '';
        const isPrime = name.includes('Prime');

        if (cat === 'warframes' || type === 'warframe') {
            return isPrime ? 'Warframe Prime' : 'Warframe';
        }
        if (cat === 'primary' || type === 'primary') {
            return isPrime ? 'Arma Primária Prime' : 'Arma Primária';
        }
        if (cat === 'secondary' || type === 'secondary') {
            return isPrime ? 'Arma Secundária Prime' : 'Arma Secundária';
        }
        if (cat === 'melee' || type === 'melee') {
            return isPrime ? 'Arma Corpo a Corpo Prime' : 'Arma Corpo a Corpo';
        }
        if (cat === 'sentinels' || type === 'sentinel') {
            return isPrime ? 'Sentinela Prime' : 'Sentinela';
        }
        if (cat === 'archwing' || type === 'archwing') {
            return isPrime ? 'Archwing Prime' : 'Archwing';
        }
        if (cat === 'pets' || type === 'pet') return 'Companheiro';
        if (cat === 'necramechs') return 'Necramech';
        return 'Outro';
    }

    // Parse recipes from raw API items
    static parseRecipes(items) {
        const recipes = [];
        const seenNames = new Set();

        items.forEach(item => {
            // Must have components to be craftable
            if (!item.components || item.components.length === 0) return;
            if (!item.name) return;

            // Skip resources, mods, relics, etc.
            const cat = (item.category || '').toLowerCase();
            const type = (item.type || '').toLowerCase();
            const validCats = ['warframes', 'primary', 'secondary', 'melee',
                             'sentinels', 'archwing', 'necramechs', 'pets'];
            const validTypes = ['warframe', 'primary', 'secondary', 'melee',
                              'sentinel', 'archwing', 'pet', 'necramech',
                              'arch-gun', 'arch-melee'];

            if (!validCats.includes(cat) && !validTypes.includes(type)) return;

            // Skip duplicates
            if (seenNames.has(item.name)) return;
            seenNames.add(item.name);

            // Extract component names
            const components = item.components
                .map(c => c.name || c.itemName || '')
                .filter(name => {
                    if (!name) return false;
                    const lower = name.toLowerCase();
                    // Skip generic resources
                    if (['credits', 'orokin cell', 'neurodes', 'morphics',
                         'control module', 'gallium', 'neural sensors',
                         'neurode', 'plastids', 'polymer bundle', 'rubedo',
                         'salvage', 'ferrite', 'nano spores', 'alloy plate',
                         'circuits', 'oxium', 'cryotic', 'argon crystal',
                         'tellurium', 'nitain extract', 'forma',
                         'kuva', 'void traces'].some(r => lower === r.toLowerCase())) {
                        return false;
                    }
                    // Skip quantities-only entries
                    if (/^\d+$/.test(name.trim())) return false;
                    return true;
                });

            // Must have at least 2 components to be a meaningful recipe
            if (components.length < 2) return;

            const mappedCategory = this.mapCategory(item);

            recipes.push({
                name: item.name,
                category: mappedCategory,
                components: components,
                imageName: item.imageName || null,
                wikiaUrl: item.wikiaUrl || null,
                wikiaThumbnail: item.wikiaThumbnail || null,
                description: item.description || ''
            });
        });

        // Sort by name
        recipes.sort((a, b) => a.name.localeCompare(b.name));

        return recipes;
    }

    // Get all unique components from recipes
    static extractAllComponents(recipes) {
        const comps = new Set();
        recipes.forEach(r => r.components.forEach(c => comps.add(c)));
        return Array.from(comps).sort();
    }

    // Populate category filter dropdown
    static getCategories(recipes) {
        const cats = new Set();
        recipes.forEach(r => cats.add(r.category));
        return Array.from(cats).sort();
    }
}

// ===== INVENTORY MANAGER =====
class InventoryManager {
    constructor() {
        this.currentUser = null;
        this.inventory = {};
    }

    _getKey() { return `wf_inventory_${this.currentUser}`; }

    loadUser(username) {
        this.currentUser = username.toLowerCase().trim();
        const data = localStorage.getItem(this._getKey());
        try { this.inventory = data ? JSON.parse(data) : {}; }
        catch(e) { this.inventory = {}; }
        localStorage.setItem('wf_last_user', this.currentUser);
    }

    save() {
        if (!this.currentUser) return;
        localStorage.setItem(this._getKey(), JSON.stringify(this.inventory));
    }

    hasItem(name) { return (this.inventory[name] || 0) > 0; }
    getQuantity(name) { return this.inventory[name] || 0; }

    addItem(name, qty = 1) {
        this.inventory[name] = (this.inventory[name] || 0) + qty;
        this.save();
    }

    removeItem(name) {
        delete this.inventory[name];
        this.save();
    }

    setQuantity(name, qty) {
        if (qty <= 0) delete this.inventory[name];
        else this.inventory[name] = qty;
        this.save();
    }

    getAllItems() {
        return Object.entries(this.inventory)
            .filter(([_, q]) => q > 0)
            .map(([name, quantity]) => ({ name, quantity }))
            .sort((a, b) => a.name.localeCompare(b.name));
    }

    getRecipeProgress(recipe) {
        const total = recipe.components.length;
        let owned = 0;
        const details = recipe.components.map(comp => {
            const has = this.hasItem(comp);
            if (has) owned++;
            return { name: comp, owned: has, quantity: this.getQuantity(comp) };
        });
        return { total, owned, details, percentage: total > 0 ? (owned / total) * 100 : 0 };
    }

    exportData() {
        return JSON.stringify({
            user: this.currentUser,
            inventory: this.inventory,
            exportDate: new Date().toISOString()
        }, null, 2);
    }

    importData(jsonStr) {
        try {
            const data = JSON.parse(jsonStr);
            if (data.inventory && typeof data.inventory === 'object') {
                this.inventory = data.inventory;
                this.save();
                return true;
            }
            return false;
        } catch(e) { return false; }
    }

    findRecipesUsing(compName) {
        return RECIPES.filter(r => r.components.includes(compName));
    }

    static getLastUser() { return localStorage.getItem('wf_last_user'); }
}

// ===== INITIALIZE MANAGERS =====
const inventoryMgr = new InventoryManager();

// ===== DOM ELEMENTS =====
const $ = id => document.getElementById(id);
const el = {
    loadingScreen: $('loadingScreen'),
    loadingBar: $('loadingBar'),
    loadingStatus: $('loadingStatus'),
    loadingError: $('loadingError'),
    app: $('app'),
    loginModal: $('loginModal'),

let toastTimeout = null;

// ===== UTILITY =====
function showToast(msg, type = 'success') {
    el.toast.textContent = msg;
    el.toast.className = `toast ${type}`;
    el.toast.classList.remove('hidden');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => el.toast.classList.add('hidden'), 2500);
}

function normalize(str) {
    return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function setLoadingProgress(percent, status) {
    el.loadingBar.style.width = percent + '%';
    el.loadingStatus.textContent = status;
}

// ===== CACHE MANAGEMENT =====
function cacheApiData(recipes) {
    try {
        localStorage.setItem('wf_recipes_cache', JSON.stringify(recipes));
        localStorage.setItem('wf_recipes_cache_time', Date.now().toString());
    } catch(e) {
        console.warn('Cache storage failed:', e);
    }
}

function getCachedData() {
    try {
        const cached = localStorage.getItem('wf_recipes_cache');
        const cacheTime = localStorage.getItem('wf_recipes_cache_time');
        if (cached && cacheTime) {
            const age = Date.now() - parseInt(cacheTime);
            // Cache valid for 24 hours
            if (age < 24 * 60 * 60 * 1000) {
                return JSON.parse(cached);
            }
        }
    } catch(e) {}
    return null;
}

// ===== LOAD DATA FROM API =====
async function loadDataFromAPI(forceRefresh = false) {
    setLoadingProgress(5, 'Verificando cache local...');

    // Try cache first
    if (!forceRefresh) {
        const cached = getCachedData();
        if (cached && cached.length > 0) {
            setLoadingProgress(80, `Cache encontrado: ${cached.length} receitas`);
            RECIPES = cached;
            ALL_COMPONENTS = WarframeAPI.extractAllComponents(RECIPES);
            API_SOURCE = 'cache';
            API_LOADED = true;
            setLoadingProgress(100, 'Dados carregados do cache!');
            return true;
        }
    }

    // Try GitHub (primary source)
    setLoadingProgress(10, 'Conectando ao GitHub WFCD...');
    try {
        setLoadingProgress(20, 'Baixando banco de dados completo...');
        const rawItems = await WarframeAPI.fetchFromGitHub();
        setLoadingProgress(60, `Processando ${rawItems.length} itens...`);

        RECIPES = WarframeAPI.parseRecipes(rawItems);
        ALL_COMPONENTS = WarframeAPI.extractAllComponents(RECIPES);
        API_SOURCE = 'github';
        API_LOADED = true;

        setLoadingProgress(90, `${RECIPES.length} receitas encontradas!`);
        cacheApiData(RECIPES);
        setLoadingProgress(100, 'Dados carregados com sucesso!');
        return true;
    } catch(err1) {
        console.warn('GitHub fetch failed:', err1);
        setLoadingProgress(30, 'GitHub indisponível. Tentando API alternativa...');
    }

    // Try WarframeStat.us (backup)
    try {
        setLoadingProgress(40, 'Conectando ao WarframeStat.us...');
        const rawItems = await WarframeAPI.fetchFromWarframeStat();
        setLoadingProgress(60, `Processando ${rawItems.length} itens...`);

        RECIPES = WarframeAPI.parseRecipes(rawItems);
        ALL_COMPONENTS = WarframeAPI.extractAllComponents(RECIPES);
        API_SOURCE = 'warframestat';
        API_LOADED = true;

        setLoadingProgress(90, `${RECIPES.length} receitas encontradas!`);
        cacheApiData(RECIPES);
        setLoadingProgress(100, 'Dados carregados com sucesso!');
        return true;
    } catch(err2) {
        console.warn('WarframeStat fetch failed:', err2);
    }

    // Both failed - try older cache (even if expired)
    try {
        const oldCache = localStorage.getItem('wf_recipes_cache');
        if (oldCache) {
            RECIPES = JSON.parse(oldCache);
            ALL_COMPONENTS = WarframeAPI.extractAllComponents(RECIPES);
            API_SOURCE = 'cache-expired';
            API_LOADED = true;
            setLoadingProgress(100, 'Usando cache antigo (sem internet)');
            return true;
        }
    } catch(e) {}

    return false;
}

// ===== RECIPES RENDERING =====
function renderRecipes() {
    const search = normalize(el.recipeSearch.value);
    const catFilter = el.categoryFilter.value;
    const progFilter = el.progressFilter.value;

    let filtered = RECIPES.filter(recipe => {
        if (search && !normalize(recipe.name).includes(search)) return false;
        if (catFilter !== 'all' && recipe.category !== catFilter) return false;
        if (progFilter !== 'all') {
            const p = inventoryMgr.getRecipeProgress(recipe).percentage;
            if (progFilter === 'complete' && p !== 100) return false;
            if (progFilter === 'partial' && (p === 0 || p === 100)) return false;
            if (progFilter === 'none' && p !== 0) return false;
        }
        return true;
    });

    // Sort: partial first (most progress), then none, then complete
    filtered.sort((a, b) => {
        const pa = inventoryMgr.getRecipeProgress(a).percentage;
        const pb = inventoryMgr.getRecipeProgress(b).percentage;
        // Complete items go to the end
        if (pa === 100 && pb !== 100) return 1;
        if (pb === 100 && pa !== 100) return -1;
        // Higher progress first
        if (pb !== pa) return pb - pa;
        return a.name.localeCompare(b.name);
    });

    el.recipesGrid.innerHTML = '';

    if (filtered.length === 0) {
        el.recipesGrid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <h3>Nenhuma receita encontrada</h3>
                <p>Ajuste os filtros de busca</p>
            </div>`;
        return;
    }

    filtered.forEach(recipe => {
        const progress = inventoryMgr.getRecipeProgress(recipe);
        const isPrime = recipe.name.includes('Prime');
        const pct = progress.percentage;

        let badgeClass, badgeText;
        if (pct === 100) { badgeClass = 'complete'; badgeText = 'Completo'; }
        else if (pct > 0) { badgeClass = 'partial'; badgeText = 'Parcial'; }
        else { badgeClass = 'none'; badgeText = 'Faltam todos'; }

        let fillClass;
        if (isPrime) fillClass = pct === 100 ? 'gold' : pct > 0 ? 'orange' : 'red';
        else fillClass = pct === 100 ? 'green' : pct > 0 ? 'orange' : 'red';

        const tags = progress.details.map(d => {
            let short = d.name;
            // Shorten: remove the parent name
            short = short.replace(recipe.name, '').trim();
            if (short.length > 25) short = short.substring(0, 22) + '...';
            if (!short) short = d.name;
            return `<span class="recipe-item-tag${d.owned ? ' owned' : ''}">${d.owned ? '<span class="check">✓</span>' : ''}${short}</span>`;
        }).join('');

        const card = document.createElement('div');
        card.className = `recipe-card${isPrime ? ' prime' : ''}`;
        card.innerHTML = `
            <div class="recipe-card-header">
                <div>
                    <div class="recipe-name">${recipe.name}</div>
                    <div class="recipe-category">${recipe.category}</div>
                </div>
                <span class="recipe-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="recipe-card-body">
                <div class="recipe-progress-bar">
                    <div class="recipe-progress-fill ${fillClass}" style="width:${pct}%"></div>
                </div>
                <div class="recipe-items-preview">${tags}</div>
                <div class="recipe-counter">${progress.owned}/${progress.total}</div>
            </div>`;

        card.addEventListener('click', () => openRecipeDetail(recipe));
        el.recipesGrid.appendChild(card);
    });
}

function renderRecipeStats() {
    let total = RECIPES.length, complete = 0, partial = 0, totalComp = 0, ownedComp = 0;
    RECIPES.forEach(r => {
        const p = inventoryMgr.getRecipeProgress(r);
        totalComp += p.total;
        ownedComp += p.owned;
        if (p.percentage === 100) complete++;
        else if (p.percentage > 0) partial++;
    });

    el.recipesStats.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon blue">📋</div>
            <div class="stat-info">
                <div class="stat-value">${total}</div>
                <div class="stat-label">Total Receitas</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div class="stat-info">
                <div class="stat-value">${complete}</div>
                <div class="stat-label">Completas</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">🔶</div>
            <div class="stat-info">
                <div class="stat-value">${partial}</div>
                <div class="stat-label">Parciais</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon gold">🧩</div>
            <div class="stat-info">
                <div class="stat-value">${ownedComp}/${totalComp}</div>
                <div class="stat-label">Componentes</div>
            </div>
        </div>`;
}

// ===== RECIPE DETAIL =====
function openRecipeDetail(recipe) {
    const progress = inventoryMgr.getRecipeProgress(recipe);
    const isPrime = recipe.name.includes('Prime');
    const pct = progress.percentage;

    let fillClass;
    if (isPrime) fillClass = pct === 100 ? 'gold' : pct > 0 ? 'orange' : 'red';
    else fillClass = pct === 100 ? 'green' : pct > 0 ? 'orange' : 'red';

    let html = `
        <div class="recipe-detail-info">
            <div class="recipe-detail-category">${recipe.category}</div>
            ${recipe.description ? `<p style="color:var(--text-muted);font-size:13px;margin-top:6px;">${recipe.description}</p>` : ''}
        </div>
        <div class="recipe-detail-progress">
            <div class="recipe-detail-progress-bar">
                <div class="recipe-detail-progress-fill ${fillClass}" style="width:${pct}%"></div>
            </div>
            <div class="recipe-detail-progress-text">${progress.owned}/${progress.total}</div>
        </div>
        <div class="recipe-detail-items">`;

    progress.details.forEach(item => {
        html += `
            <div class="recipe-detail-item ${item.owned ? 'owned' : 'missing'}">
                <div class="recipe-detail-item-name">
                    ${item.owned ? '✓' : '✗'} ${item.name}
                    ${item.owned && item.quantity > 1 ? `<span style="color:var(--text-muted);font-size:12px;">(x${item.quantity})</span>` : ''}
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span class="recipe-detail-item-status ${item.owned ? 'owned' : 'missing'}">
                        ${item.owned ? 'No inventário' : 'Faltando'}
                    </span>
                    <button class="toggle-btn ${item.owned ? 'remove-inv' : 'add-inv'}"
                            data-component="${item.name}"
                            data-action="${item.owned ? 'remove' : 'add'}">
                        ${item.owned ? 'Remover' : 'Adicionar'}
                    </button>
                </div>
            </div>`;
    });

    html += `</div>`;

    if (recipe.wikiaUrl) {
        html += `<div style="margin-top:16px;text-align:center;">
            <a href="${recipe.wikiaUrl}" target="_blank" rel="noopener"
               style="color:var(--accent-primary);font-size:13px;text-decoration:none;">
               📖 Ver na Wiki do Warframe
            </a>
        </div>`;
    }

    el.recipeDetailTitle.textContent = recipe.name;
    el.recipeDetailBody.innerHTML = html;
    el.recipeDetailModal.classList.remove('hidden');

    // Attach toggle buttons
    el.recipeDetailBody.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const comp = btn.dataset.component;
            if (btn.dataset.action === 'add') {
                inventoryMgr.addItem(comp, 1);
                showToast(`${comp} adicionado!`);
            } else {
                inventoryMgr.removeItem(comp);
                showToast(`${comp} removido`, 'error');
            }
            openRecipeDetail(recipe);
            renderAll();
        });
    });
}

// ===== INVENTORY =====
function renderInventory() {
    const search = normalize(el.inventorySearch.value);
    let items = inventoryMgr.getAllItems();
    if (search) items = items.filter(i => normalize(i.name).includes(search));

    el.inventoryList.innerHTML = '';

    if (items.length === 0) {
        el.inventoryList.innerHTML = `
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                </svg>
                <h3>Inventário vazio</h3>
                <p>Clique em "Adicionar Item" para cadastrar componentes</p>
            </div>`;
        return;
    }

    items.forEach(item => {
        const recipes = inventoryMgr.findRecipesUsing(item.name);
        const recipesText = recipes.length > 0
            ? `Usado em: ${recipes.slice(0, 3).map(r => r.name).join(', ')}${recipes.length > 3 ? ` +${recipes.length - 3}` : ''}`
            : 'Item avulso';

        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.innerHTML = `
            <div class="inventory-item-info">
                <div class="inventory-item-name">${item.name}</div>
                <div class="inventory-item-recipes">${recipesText}</div>
            </div>
            <div class="inventory-item-actions">
                <div class="quantity-control">
                    <button class="quantity-btn minus" data-item="${item.name}">−</button>
                    <span class="quantity-value">${item.quantity}</span>
                    <button class="quantity-btn plus" data-item="${item.name}">+</button>
                </div>
                <button class="btn-danger-outline delete-btn" data-item="${item.name}">✗</button>
            </div>`;

        div.querySelector('.minus').addEventListener('click', () => {
            if (item.quantity <= 1) {
                inventoryMgr.removeItem(item.name);
                showToast(`${item.name} removido`, 'error');
            } else {
                inventoryMgr.setQuantity(item.name, item.quantity - 1);
            }
            renderAll();
        });

        div.querySelector('.plus').addEventListener('click', () => {
            inventoryMgr.setQuantity(item.name, item.quantity + 1);
            renderAll();
        });

        div.querySelector('.delete-btn').addEventListener('click', () => {
            inventoryMgr.removeItem(item.name);
            showToast(`${item.name} removido`, 'error');
            renderAll();
        });

        el.inventoryList.appendChild(div);
    });
}

function renderInventoryStats() {
    const items = inventoryMgr.getAllItems();
    const totalUnique = items.length;
    const totalQty = items.reduce((s, i) => s + i.quantity, 0);

    el.inventoryStats.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon blue">📦</div>
            <div class="stat-info">
                <div class="stat-value">${totalUnique}</div>
                <div class="stat-label">Itens Únicos</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon gold">🔢</div>
            <div class="stat-info">
                <div class="stat-value">${totalQty}</div>
                <div class="stat-label">Total de Peças</div>
            </div>
        </div>`;
}

// ===== ADD ITEM MODAL =====
function renderAddItemList() {
    const search = normalize(el.addItemSearch.value);
    let items = ALL_COMPONENTS;
    if (search) items = items.filter(c => normalize(c).includes(search));

    const display = items.slice(0, 60);
    el.addItemList.innerHTML = '';

    if (display.length === 0) {
        el.addItemList.innerHTML = `<div class="empty-state" style="padding:20px;"><p>Nenhum item encontrado</p></div>`;
        return;
    }

    display.forEach(comp => {
        const inInv = inventoryMgr.hasItem(comp);
        const recipes = inventoryMgr.findRecipesUsing(comp);

        const div = document.createElement('div');
        div.className = `add-item-option${inInv ? ' in-inventory' : ''}`;
        div.innerHTML = `
            <div>
                <div class="add-item-option-name">${comp}</div>
                <div class="add-item-option-sub">${recipes.slice(0, 2).map(r => r.name).join(', ') || 'Componente'}</div>
            </div>
            <button class="add-item-option-btn ${inInv ? 'remove' : 'add'}">
                ${inInv ? 'Remover' : 'Adicionar'}
            </button>`;

        div.querySelector('button').addEventListener('click', (e) => {
            e.stopPropagation();
            if (inInv) {
                inventoryMgr.removeItem(comp);
                showToast(`${comp} removido`, 'error');
            } else {
                inventoryMgr.addItem(comp, 1);
                showToast(`${comp} adicionado!`);
            }
            renderAddItemList();
            renderAll();
        });

        el.addItemList.appendChild(div);
    });

    if (items.length > 60) {
        const more = document.createElement('div');
        more.className = 'empty-state';
        more.style.padding = '10px';
        more.innerHTML = `<p style="font-size:12px;">Mostrando 60 de ${items.length}. Refine a busca.</p>`;
        el.addItemList.appendChild(more);
    }
}

// ===== API STATUS BADGE =====
function updateApiStatus() {
    if (API_LOADED) {
        if (API_SOURCE === 'cache-expired') {
            el.apiStatusBadge.className = 'api-status offline';
            el.apiStatusBadge.textContent = 'OFFLINE';
            el.apiStatusBadge.title = `Cache antigo (${RECIPES.length} receitas)`;
        } else if (API_SOURCE === 'cache') {
            el.apiStatusBadge.className = 'api-status online';
            el.apiStatusBadge.textContent = `CACHE ✓`;
            el.apiStatusBadge.title = `${RECIPES.length} receitas do cache`;
        } else {
            el.apiStatusBadge.className = 'api-status online';
            el.apiStatusBadge.textContent = `API ✓`;
            el.apiStatusBadge.title = `${RECIPES.length} receitas de ${API_SOURCE}`;
        }
    } else {
        el.apiStatusBadge.className = 'api-status offline';
        el.apiStatusBadge.textContent = 'ERRO';
    }
}

// ===== BOOT SEQUENCE =====
async function boot() {
    setLoadingProgress(0, 'Inicializando...');

    const success = await loadDataFromAPI();

    if (!success) {
        el.loadingError.style.display = 'block';
        el.loadingError.innerHTML = `
            <p>⚠️ Não foi possível carregar os dados do Warframe.</p>
            <p>Verifique sua conexão com a internet e tente novamente.</p>
            <button onclick="location.reload()">TENTAR NOVAMENTE</button>`;
        el.loadingStatus.textContent = 'Erro ao carregar dados';
        return;
    }

    // Data loaded successfully
    populateCategoryFilter();
    updateApiStatus();

    // Check for saved user
    const lastUser = InventoryManager.getLastUser();
    if (lastUser) {
        inventoryMgr.loadUser(lastUser);
        el.userName.textContent = lastUser.toUpperCase();
    } else {
        el.loginModal.classList.remove('hidden');
    }

    // Show app
    setTimeout(() => {
        el.loadingScreen.classList.add('hidden');
        el.app.style.display = 'block';
        renderAll();
    }, 500);
}

// Start!
boot();

})();
</script>
</body>
